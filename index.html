<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shahaf's Vinyl Shelf</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"><style id="css">:root{--ink:#f6ecdc;--muted:#b3a58f;--brass:#d9a441;--brass2:#a8761f;--wall:#1a1512;--s:150px;--gap:26px;--plank:26px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--wall)}
body{color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;min-height:100vh;line-height:1.45;
  background:
    radial-gradient(700px 420px at 50% -60px,rgba(255,196,120,.22),transparent 70%),
    radial-gradient(500px 300px at 10% 40%,rgba(255,120,80,.06),transparent 70%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 7px),
    linear-gradient(#211a16,#120e0c)}
.room{max-width:1120px;margin:0 auto;padding:30px 16px 100px}
.top{text-align:center;padding:10px 0 22px}
.neon{font-family:Fraunces,serif;font-weight:900;font-size:clamp(34px,8vw,68px);line-height:1;letter-spacing:-.01em;color:#fff3e0;
  text-shadow:0 0 6px rgba(255,170,90,.9),0 0 22px rgba(255,120,60,.6),0 0 48px rgba(255,90,40,.35);animation:flick 7s infinite}
.neon span{font-style:italic;font-weight:400;color:#ffd9a0;display:inline-block}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.75}94%{opacity:1}96%{opacity:.85}}
.tag{color:var(--muted);font-size:13px;margin-top:10px;letter-spacing:.04em}
.counts{display:inline-flex;gap:10px;margin-top:14px;font-size:13px;color:var(--muted);background:rgba(0,0,0,.3);border:1px solid #3b2f25;padding:7px 14px;border-radius:999px}
.counts b{color:var(--ink);font-size:15px}.dot{opacity:.5}
.plates{position:sticky;top:0;z-index:8;display:flex;justify-content:center;gap:8px;padding:12px 4px;margin:0 -16px;background:linear-gradient(#18120f,rgba(24,18,15,.85));backdrop-filter:blur(8px);overflow-x:auto}
.plate{flex:none;font:700 13px "Space Grotesk",system-ui,-apple-system,sans-serif;letter-spacing:.03em;color:#2a1c08;cursor:pointer;border:0;padding:10px 16px;border-radius:8px;
  background:linear-gradient(180deg,#f3d48a,#c99434 55%,#a8761f);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 0 #6e4c14,0 6px 14px rgba(0,0,0,.4);opacity:.55;transition:.2s}
.plate.on{opacity:1;transform:translateY(-1px)}
.plate:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 0 #6e4c14}
.tools{display:flex;gap:10px;align-items:center;margin:16px auto 22px;max-width:620px}
input,select{font:500 15px "Space Grotesk",system-ui,-apple-system,sans-serif;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid #4a3a2c;border-radius:12px;padding:12px 14px;width:100%}
input:focus{outline:none;border-color:var(--brass)}
.save{font-size:12px;color:var(--muted);white-space:nowrap}

/* ---------- the shelf unit ---------- */
.unit{position:relative;border-radius:10px;padding:18px 18px 0;
  background:
    linear-gradient(90deg,rgba(0,0,0,.55),transparent 8%,transparent 92%,rgba(0,0,0,.55)),
    linear-gradient(#2b211b,#1f1813);
  box-shadow:0 0 0 14px #6b4426,0 0 0 15px #3a2414,0 30px 60px rgba(0,0,0,.6),inset 0 12px 30px rgba(0,0,0,.7);
  margin:14px 14px 40px}
.unit::before{content:"";position:absolute;inset:-14px;border-radius:12px;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 9px),repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 3px,transparent 3px 11px);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:14px}
.label{font:700 11px "Space Grotesk",system-ui,-apple-system,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#d9b77a;text-align:center;margin:0 0 12px;opacity:.8}
.shelf{--row:calc(var(--s) + 20px + var(--plank));display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--s) + var(--gap)),1fr));grid-auto-rows:var(--row);justify-items:center;align-items:end;
  margin:0 -18px;padding:0 18px;
  background:repeating-linear-gradient(180deg,transparent 0 calc(var(--row) - var(--plank)),#a06a3c calc(var(--row) - var(--plank)),#8a5a31 calc(var(--row) - var(--plank) + 6px),#74482a calc(var(--row) - 8px),#3a2414 calc(var(--row) - 8px),#1a0f08 var(--row))}
.slot{position:relative;width:var(--s);height:var(--s);margin-bottom:var(--plank);perspective:800px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.slot::after{content:"";position:absolute;left:6%;right:6%;bottom:-6px;height:12px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(5px);z-index:0}
.slot .disc{position:absolute;inset:4% 4% 4% 4%;border-radius:50%;z-index:1;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.slot .sl{position:relative;width:100%;height:100%;z-index:2;transform:rotateY(var(--ry,0deg)) rotateZ(var(--rz,0deg));transform-origin:bottom center;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.slot:hover .sl,.slot:focus-visible .sl{transform:rotateY(0) rotateZ(0) translateY(-10px)}
.slot:hover .disc{transform:translateY(-34%)}
.star{position:absolute;top:-8px;right:-8px;z-index:4;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#2a1c08;
  background:radial-gradient(circle at 30% 30%,#ffe6a8,#d9a441 60%,#a8761f);box-shadow:0 3px 8px rgba(0,0,0,.5)}

/* ---------- sleeve + art ---------- */
.sl{border-radius:4px;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06);background:#222}
.sl svg,.sl img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.sl .gloss{position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.22),transparent 35%,transparent 70%,rgba(0,0,0,.25));pointer-events:none}
.sl .txt{position:absolute;left:0;right:0;bottom:0;padding:22% 9% 8%;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff}
.sl .ta{font:700 .62em "Space Grotesk",system-ui,-apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .tt{font:900 1.15em/1 Fraunces,serif;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.slot .sl{font-size:calc(var(--s) / 9)}
.disc{background:repeating-radial-gradient(circle,#0c0c0c 0 1.4px,#1b1b1b 1.4px 2.8px);box-shadow:0 6px 18px rgba(0,0,0,.6)}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 10deg,transparent 0 30deg,rgba(255,255,255,.09) 50deg,transparent 70deg 210deg,rgba(255,255,255,.06) 230deg,transparent 250deg)}
.disc::after{content:"";position:absolute;inset:33%;border-radius:50%;background:radial-gradient(circle,#0c0c0c 0 6%,var(--lab) 7%)}

/* ---------- empty / sections ---------- */
.empty{text-align:center;color:var(--muted);padding:50px 20px 60px}
.empty b{display:block;font:900 24px Fraunces,serif;color:var(--ink);margin-bottom:6px}
.btn{font:600 13px "Space Grotesk",system-ui,-apple-system,sans-serif;text-decoration:none;color:var(--ink);border:1px solid #4a3a2c;padding:9px 13px;border-radius:999px;background:rgba(0,0,0,.25);cursor:pointer;transition:.2s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brass);color:#ffd99a}
.btn.gold{border:0;color:#2a1c08;background:linear-gradient(180deg,#f3d48a,#c99434);box-shadow:0 2px 0 #6e4c14}
.btn.gold:hover{color:#2a1c08;filter:brightness(1.08)}
.btn.danger:hover{border-color:#e0604a;color:#ff8a73}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- find records ---------- */
.panel{background:rgba(0,0,0,.28);border:1px solid #3b2f25;border-radius:16px;padding:6px 16px;max-width:760px;margin:0 auto 18px}
.ph{font:900 22px Fraunces,serif;max-width:760px;margin:26px auto 10px;display:flex;justify-content:space-between;align-items:baseline}
.ph small{font:400 13px "Space Grotesk",system-ui,-apple-system,sans-serif;color:var(--muted)}
.res{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #33281f}
.res:last-child{border:0}
.res .sl{position:relative;width:54px;height:54px;flex:none;font-size:6px}
.res .meta{flex:1;min-width:0}.res .meta b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .meta span{font-size:13px;color:var(--muted)}
.res .acts{display:flex;gap:6px;flex:none}
.res .acts .btn{padding:7px 11px;font-size:12px}
.hint{color:var(--muted);font-size:14px;padding:14px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}
.chip{font:500 13px "Space Grotesk",system-ui,-apple-system,sans-serif;color:var(--ink);background:transparent;border:1px solid #4a3a2c;border-radius:999px;padding:7px 12px;cursor:pointer}
.chip:hover{border-color:var(--brass)}
.row{display:grid;grid-template-columns:2fr 2fr 1fr;gap:10px;padding:14px 0 10px}
.formacts{display:flex;gap:8px;padding-bottom:14px;flex-wrap:wrap}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #4a3a2c;border-top-color:var(--brass);border-radius:50%;animation:rot .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- pulled-out record ---------- */
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(8,6,5,.78);backdrop-filter:blur(8px)}
.modal.open{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(560px,100%);max-height:92vh;overflow:auto;background:linear-gradient(#2a201a,#1b1511);border:1px solid #4a3a2c;border-radius:22px;padding:26px 22px 22px;box-shadow:0 30px 80px rgba(0,0,0,.7);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid #4a3a2c;background:rgba(0,0,0,.3);color:var(--ink);font-size:18px;cursor:pointer;z-index:5}
.pull{position:relative;width:min(62vw,250px);aspect-ratio:1;margin:4px 0 0 4%}
.pull .disc{position:absolute;inset:3%;border-radius:50%;animation:slide .9s .15s cubic-bezier(.2,.8,.2,1) forwards,spin 2.2s 1s linear infinite}
@keyframes slide{to{transform:translateX(46%)}}
@keyframes spin{from{transform:translateX(46%) rotate(0)}to{transform:translateX(46%) rotate(360deg)}}
.pull .sl{position:absolute;inset:0;font-size:calc(min(62vw,250px) / 9);z-index:2;animation:out .5s cubic-bezier(.2,.8,.2,1)}
@keyframes out{from{transform:scale(.6) rotateY(30deg);opacity:0}}
.sheet h3{font:900 30px/1.05 Fraunces,serif;margin-top:20px}
.sheet .by{color:var(--muted);font-size:15px;margin-top:4px}
.sheet .why{margin-top:12px;font-size:15px;color:#e3d6c1}
.sheet .tr{margin-top:10px;font-size:13px;color:var(--muted)}.sheet .tr b{color:var(--brass);font-weight:600}
.sheet .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.sheet .note{font-size:12px;color:var(--muted);margin-top:14px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140px);background:#f6ecdc;color:#1f150a;padding:12px 18px;border-radius:999px;font:600 14px "Space Grotesk",system-ui,-apple-system,sans-serif;display:flex;gap:14px;align-items:center;transition:transform .3s;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:92vw}
.toast.show{transform:translate(-50%,0)}
.toast button{background:none;border:0;font:700 14px "Space Grotesk",system-ui,-apple-system,sans-serif;color:#a3540f;cursor:pointer}

@media(max-width:600px){
  :root{--s:min(25vw,100px);--gap:10px;--plank:18px}
  .room{padding:22px 12px 90px}
  .unit{margin:12px 10px 34px;padding:14px 12px 0;box-shadow:0 0 0 10px #6b4426,0 0 0 11px #3a2414,0 24px 50px rgba(0,0,0,.6),inset 0 10px 24px rgba(0,0,0,.7)}
  .shelf{margin:0 -12px;padding:0 6px}
  .star{width:22px;height:22px;font-size:11px;top:-6px;right:-6px}
  .row{grid-template-columns:1fr 1fr}.row input:first-child{grid-column:1/-1}
  .res{flex-wrap:wrap}.res .acts{width:100%;padding-left:66px}
  .plate{padding:9px 12px;font-size:12px}
}

.label .ti{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#f3d48a,#c99434);color:#2a1c08;font-size:11px;letter-spacing:0;margin-right:4px}
.label .lc{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:rgba(0,0,0,.4);letter-spacing:0;color:#e9d3a6}
.label{font-size:13px;letter-spacing:.14em;opacity:1}
.mt{color:var(--muted);font-size:13px;text-align:center;padding:22px 10px 30px}
.tiers{display:flex;gap:6px;margin-top:14px;background:rgba(0,0,0,.3);border:1px solid #4a3a2c;border-radius:14px;padding:5px}
.tiers button{flex:1;font:600 12.5px "Space Grotesk",system-ui,-apple-system,sans-serif;color:var(--ink);background:transparent;border:0;border-radius:10px;padding:9px 4px;cursor:pointer;white-space:nowrap}
.tiers button.on{background:linear-gradient(180deg,#f3d48a,#c99434);color:#2a1c08;box-shadow:0 2px 0 #6e4c14}

.tp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 0 6px}.tp span{font-size:12px;color:var(--muted);margin-right:2px}
.chip.on{background:linear-gradient(180deg,#f3d48a,#c99434);color:#2a1c08;border-color:transparent}
.res .acts{flex-wrap:wrap;justify-content:flex-end}
.counts{flex-wrap:wrap;justify-content:center}
@media(max-width:600px){.plates{justify-content:flex-start;gap:6px}.plate{padding:9px 10px;font-size:11.5px}}

:root{--cap:40px}
.shelf{--row:calc(var(--s) + var(--cap) + 20px + var(--plank))}
.slot{height:calc(var(--s) + var(--cap))}
.slot .disc{bottom:auto;height:calc(var(--s) * .92)}
.slot .sl{height:var(--s)}
.cap{position:absolute;left:-4px;right:-4px;bottom:0;height:var(--cap);text-align:center;z-index:3;display:flex;flex-direction:column;justify-content:center;line-height:1.2;pointer-events:none}
.cap b{display:block;font:700 12.5px "Space Grotesk",system-ui,-apple-system,sans-serif;color:#f6ecdc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000}
.cap span{display:block;font:500 11px "Space Grotesk",system-ui,-apple-system,sans-serif;color:#c9b79a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot::after{bottom:calc(var(--cap) - 6px)}
@media(max-width:600px){:root{--cap:34px}.cap b{font-size:11px}.cap span{font-size:9.5px}}

.tracks{margin-top:18px;border-top:1px solid #3b2f25;padding-top:12px}
.tlh{font:600 13px "Space Grotesk",system-ui,-apple-system,sans-serif;color:var(--muted);margin-bottom:8px}
.tl{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.tl li{display:flex;gap:10px;align-items:baseline;padding:7px 2px;border-bottom:1px solid #2c231c;font-size:14px}
.tl li:last-child{border:0}
.tl .tn{width:22px;flex:none;text-align:right;color:var(--muted);font-size:12px}
.tl .tt2{flex:1;color:#efe3cf}
.tl .td{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.tl .disc-h{font:700 11px "Space Grotesk",system-ui,-apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);border:0;padding-top:12px}
.res[data-prev]{cursor:pointer}
.res[data-prev]:hover .meta b{color:#ffd99a}

/* ---------- phone polish ---------- */
.dl{margin-top:12px;font:600 12px "Space Grotesk",system-ui,sans-serif;color:var(--ink);background:rgba(0,0,0,.3);border:1px solid #4a3a2c;border-radius:999px;padding:7px 14px;cursor:pointer}
.dl:hover{border-color:var(--brass)}
.tp{flex-wrap:nowrap}
.tp .chip{flex:1;text-align:center;padding:8px 6px;white-space:nowrap}
@media(max-width:600px){
  .room{padding:14px 10px 90px}
  .top{padding:4px 0 12px}
  .neon{font-size:34px}
  .tag{font-size:11.5px;margin-top:6px}
  .counts{margin-top:10px;padding:5px 12px;font-size:12px}
  .plates{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 -10px;padding:10px;overflow:visible}
  .plate{padding:10px 4px;font-size:12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tools{margin:12px auto 14px}
  input{font-size:16px}
  .ph{font-size:19px;margin:18px 2px 8px}.ph small{font-size:11.5px}
  .panel{padding:2px 12px;border-radius:14px}
  .tp{gap:5px;padding:10px 0 4px}.tp span{display:none}.tp .chip{font-size:11.5px;padding:8px 2px}
  .res{display:grid;grid-template-columns:48px 1fr;column-gap:12px;row-gap:8px;padding:10px 0;align-items:center}
  .res .sl{width:48px;height:48px}
  .res .meta b{font-size:14px;white-space:normal}.res .meta span{font-size:12px}
  .res .acts{grid-column:2;width:auto;padding:0;justify-content:flex-start;gap:6px;flex-wrap:nowrap}
  .res .acts .btn{padding:6px 10px;font-size:11.5px}
  .unit{margin:10px 6px 26px}
  .modal{padding:0;align-items:flex-end}
  .sheet{width:100%;max-height:94vh;border-radius:22px 22px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom))}
  .pull{width:min(58vw,230px);margin-top:0}
  .sheet h3{font-size:26px;margin-top:14px}
  .tiers button{font-size:11.5px;padding:9px 2px}
  .sheet .acts .btn{padding:8px 12px;font-size:12.5px}
  .tl{max-height:none}
  .x{position:sticky;float:right;top:0}
}

.covrow{margin-top:12px}
.linkbtn{background:none;border:0;color:var(--brass);font:600 13px "Space Grotesk",system-ui,sans-serif;cursor:pointer;padding:4px 0}
#covpick{margin-top:6px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.copt{background:rgba(0,0,0,.3);border:1px solid #4a3a2c;border-radius:10px;padding:5px;cursor:pointer;color:var(--ink);text-align:left}
.copt:hover,.copt:focus{border-color:var(--brass)}
.copt img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
.copt span{display:block;font:500 10.5px "Space Grotesk",system-ui,sans-serif;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}

.syncbox{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px}
.syncbox .dl{margin-top:0}
.sst{font:500 12px "Space Grotesk",system-ui,sans-serif;color:var(--muted)}
</style></head><body><div id="shell"><div class="room">
  <header class="top">
    <div class="neon">Shahaf's <span>Record Room</span></div>
    <p class="tag">grunge · classic rock · alt — pulled from my Spotify likes</p>
    <div class="counts"><span><b id="sWish">0</b> wanted</span><span class="dot">•</span><span><b id="sHave">0</b> on my shelf</span></div>
    <div class="syncbox" id="syncBox"></div>
  </header>
  <nav class="plates" id="tabs">
    <button data-tab="wish" class="plate on">♡ Wishlist</button>
    <button data-tab="have" class="plate">◉ My Collection</button>
    <button data-tab="add" class="plate">＋ Find records</button>
  </nav>
  <div class="tools"><input id="filter" type="search" placeholder="Filter this shelf…" autocomplete="off"><span id="saveState" class="save"></span></div>
  <main id="main"></main>
</div>
<div id="modal" class="modal" aria-hidden="true"></div>

const COVER_CACHE = {};
const coverKey = (a,t) => norm(a) + "|" + norm(t);

const artBox = (a,t) => {
  const key = coverKey(a,t);
  const cached = COVER_CACHE[key];
  const imgTag = cached ? `<img src="${esc(cached)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1">` : "";
  return `<div class="art" data-cov="${esc(key)}" data-a="${esc(a)}" data-t="${esc(t)}">${art(a,t)}${imgTag}</div>`;
};

function applyCover(key, url){
  if (!url) return;
  COVER_CACHE[key] = url;
  try{ localStorage.setItem("vinylCoversV5", JSON.stringify(COVER_CACHE)); }catch(e){}
  document.querySelectorAll(".sl[data-cov]").forEach(box => {
    if (box.dataset.cov === key && !box.querySelector("img")){
      const img = document.createElement("img");
      img.src = url;
      img.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1";
      img.onerror = () => {
        img.remove();
        delete COVER_CACHE[key];
        try{ localStorage.setItem("vinylCoversV5", JSON.stringify(COVER_CACHE)); }catch(e){}
      };
      box.appendChild(img);
    }
  });
}

function jsonp(urlBuilder){
  return new Promise(resolve => {
    const cb = "__cb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); resolve(null); }, 6000);
    function cleanup(){
      clearTimeout(timer);
      delete window[cb];
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); resolve(null); };
    s.src = urlBuilder(cb);
    document.head.appendChild(s);
  });
}

function isBadTitle(text){
  return /tribute|karaoke|made famous|cover band|instrumental version|lullaby|vitamin string|piano tribute|8-bit|in the style of/i.test(text);
}

const relaxT = s => norm(s).replace(/\b(mtv|live|the|remastered|remaster|edition|deluxe|version)\b/g," ").replace(/\s+/g," ").trim();
function scoreMatch(candArtist, candAlbum, targetArtist, targetAlbum, trackCount, sourceBonus){
  if (isBadTitle(candArtist + " " + candAlbum)) return -100;
  const na = norm(targetArtist), nt = norm(targetAlbum);
  const ra = norm(candArtist), rc = norm(candAlbum);
  const stripped = candAlbum.replace(/\s*[\(\[]\s*(remaster(ed)?|deluxe|super deluxe|edition|anniversary|legacy|expanded|bonus|reissue|mono|stereo|\d{4}\s*remaster(ed)?)[^\)\]]*[\)\]]/gi, "").trim();
  const rcClean = norm(stripped);

  let score = sourceBonus || 0;
  if (ra === na) score += 60;
  else if (ra.includes(na) || na.includes(ra)) score += 35;
  else return -100;

  if (rc === nt) score += 80;
  else if (rcClean === nt) score += 70;
  else if (rc.startsWith(nt + " ") || rcClean.startsWith(nt + " ")) score += 10;
  else if (nt.length >= 3 && (rc.includes(nt) || rcClean.includes(nt))) score += 20;
  else if (relaxT(candAlbum) && relaxT(candAlbum) === relaxT(targetAlbum)) score += 60;
  else return -100;

  // Prefer standard studio album track counts (typically 6-18 tracks) over massive box sets (30+ tracks) or 1-3 track singles
  if (trackCount){
    if (trackCount >= 6 && trackCount <= 22) score += 15;
    else if (trackCount > 25) score -= 25;
    else if (trackCount <= 3) score -= 30;
  }

  // Penalize alternate editions (box sets, super deluxe, remixes, live, demos) that often have non-original covers
  const lowAlbum = candAlbum.toLowerCase();
  const lowTarget = targetAlbum.toLowerCase();
  const altFlags = ["super deluxe", "box set", "deluxe", "remix", "anniversary", "collector", "expanded", "live", "single", "ep", "demo", "commentary"];
  for (const flag of altFlags){
    if (lowAlbum.includes(flag) && !lowTarget.includes(flag) && !(flag==="live" && /unplugged|live|mtv|concert/.test(lowTarget))){
      score -= (flag === "super deluxe" || flag === "box set" || flag === "remix" || flag === "live") ? 45 : 25;
    }
  }

  return score;
}

async function gatherCandidates(a, t){
  const cleanT = t.replace(/\s*\([^)]*\)\s*/g, " ").trim() || t;
  const candidates = [];

  const [dz1, it1, it2] = await Promise.all([
    jsonp(cb => `https://api.deezer.com/search/album?q=${encodeURIComponent(`artist:"${a}" album:"${cleanT}"`)}&limit=12&output=jsonp&callback=${cb}`),
    jsonp(cb => `https://itunes.apple.com/search?term=${encodeURIComponent(`${a} ${cleanT}`)}&entity=album&limit=15&callback=${cb}`),
    cleanT.length <= 4
      ? jsonp(cb => `https://itunes.apple.com/search?term=${encodeURIComponent(cleanT)}&entity=album&attribute=albumTerm&limit=15&callback=${cb}`)
      : Promise.resolve(null)
  ]);

  if (dz1 && dz1.data){
    for (const item of dz1.data){
      const url = item.cover_big || item.cover_medium;
      if (!url) continue;
      const sc = scoreMatch(item.artist && item.artist.name || "", item.title || "", a, cleanT, item.nb_tracks, 4);
      if (sc > 0) candidates.push({ url, sc });
    }
  }

  for (const res of [it1, it2]){
    if (res && res.results){
      for (const item of res.results){
        if (!item.artworkUrl100) continue;
        const url = item.artworkUrl100.replace("100x100bb", "500x500bb");
        const sc = scoreMatch(item.artistName || "", item.collectionName || "", a, cleanT, item.trackCount, 6);
        if (sc > 0) candidates.push({ url, sc });
      }
    }
  }

  if (!candidates.length){
    const dzFallback = await jsonp(cb => `https://api.deezer.com/search/album?q=${encodeURIComponent(`${a} ${cleanT}`)}&limit=10&output=jsonp&callback=${cb}`);
    if (dzFallback && dzFallback.data){
      for (const item of dzFallback.data){
        const url = item.cover_big || item.cover_medium;
        if (!url) continue;
        const sc = scoreMatch(item.artist && item.artist.name || "", item.title || "", a, cleanT, item.nb_tracks, 0);
        if (sc > 0) candidates.push({ url, sc });
      }
    }
  }

  if (!candidates.length && relaxT(cleanT) !== norm(cleanT)){
    const it3 = await jsonp(cb => `https://itunes.apple.com/search?term=${encodeURIComponent(`${a} ${relaxT(cleanT)}`)}&entity=album&limit=15&callback=${cb}`);
    if (it3 && it3.results) for (const item of it3.results){
      if (!item.artworkUrl100) continue;
      const sc = scoreMatch(item.artistName || "", item.collectionName || "", a, cleanT, item.trackCount, 6);
      if (sc > 0) candidates.push({ url: item.artworkUrl100.replace("100x100bb", "500x500bb"), sc });
    }
  }
  candidates.sort((x, y) => y.sc - x.sc);
  return candidates.length ? candidates[0].url : null;
}

const INFLIGHT = new Set();
async function loadCovers(){
  const els = Array.from(document.querySelectorAll(".sl[data-cov]"));
  const tasks = [];
  for (const el of els){
    const key = el.dataset.cov;
    if (COVER_CACHE[key]){
      applyCover(key, COVER_CACHE[key]);
      continue;
    }
    if (INFLIGHT.has(key)) continue;
    INFLIGHT.add(key);
    tasks.push({ key, a: el.dataset.a, t: el.dataset.t });
  }
  for (const item of tasks){
    const url = await gatherCandidates(item.a, item.t);
    INFLIGHT.delete(item.key);
    if (url) applyCover(item.key, url);
    await new Promise(r => setTimeout(r, 80));
  }
}

const fmt = ms => { if(!ms) return ""; const s=Math.round(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
async function fetchTracks(a,t){
  const key = coverKey(a,t); if (TRACKS[key]) return TRACKS[key];
  const cleanT = t.replace(/\s*\([^)]*\)\s*/g," ").trim() || t;
  let out = null;
  let best = null;
  for (const term of [a+" "+cleanT, a+" "+relaxT(cleanT)]){
    const it = await jsonp(cb=>`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=album&limit=15&callback=${cb}`);
    if (it && it.results) for (const r of it.results){ const sc = scoreMatch(r.artistName||"", r.collectionName||"", a, cleanT, r.trackCount, 6); if (sc>0 && (!best || sc>best.sc)) best = {id:r.collectionId, sc}; }
    if (best || relaxT(cleanT)===norm(cleanT)) break;
  }
  if (best){
    const lk = await jsonp(cb=>`https://itunes.apple.com/lookup?id=${best.id}&entity=song&limit=200&callback=${cb}`);
    if (lk && lk.results){
      const tr = lk.results.filter(r=>r.wrapperType==="track").sort((x,y)=>(x.discNumber-y.discNumber)||(x.trackNumber-y.trackNumber));
      if (tr.length) out = tr.map(r=>({d:r.discNumber||1, n:r.trackNumber, name:r.trackName, ms:r.trackTimeMillis}));
    }
  }
  if (!out){
    const dz = await jsonp(cb=>`https://api.deezer.com/search/album?q=${encodeURIComponent(`artist:"${a}" album:"${cleanT}"`)}&limit=12&output=jsonp&callback=${cb}`);
    let b2 = null;
    if (dz && dz.data) for (const r of dz.data){ const sc = scoreMatch(r.artist&&r.artist.name||"", r.title||"", a, cleanT, r.nb_tracks, 4); if (sc>0 && (!b2 || sc>b2.sc)) b2 = {id:r.id, sc}; }
    if (b2){
      const tr = await jsonp(cb=>`https://api.deezer.com/album/${b2.id}/tracks?limit=200&output=jsonp&callback=${cb}`);
      if (tr && tr.data && tr.data.length) out = tr.data.map((r,i)=>({d:r.disk_number||1, n:r.track_position||i+1, name:r.title, ms:(r.duration||0)*1000}));
    }
  }
  if (out){ TRACKS[key] = out; try{ localStorage.setItem("vinylTracksV1", JSON.stringify(TRACKS)); }catch(e){} }
  return out;
}
function tracksHTML(tr){
  const discs = new Set(tr.map(x=>x.d)).size > 1;
  let last = null, h = "";
  for (const x of tr){ if (discs && x.d!==last){ h += `<li class="disc-h">Disc ${x.d}</li>`; last = x.d; }
    h += `<li><span class="tn">${x.n}</span><span class="tt2">${esc(x.name)}</span><span class="td">${fmt(x.ms)}</span></li>`; }
  const total = tr.reduce((s,x)=>s+(x.ms||0),0);
  return `<div class="tlh">🎵 ${tr.length} songs${total?` · ${Math.round(total/60000)} min`:""}</div><ol class="tl">${h}</ol>`;
}
async function showTracks(a,t){
  const box = $("#tracks"); if (!box) return;
  const want = coverKey(a,t); box.dataset.k = want;
  if (!TRACKS[want]) box.innerHTML = `<div class="tlh"><span class="spin"></span>Loading songs…</div>`;
  const tr = await fetchTracks(a,t);
  if (!$("#tracks") || $("#tracks").dataset.k !== want) return;
  $("#tracks").innerHTML = tr ? tracksHTML(tr) : `<div class="tlh">Couldn't find the song list for this one. Try Spotify.</div>`;
}


/* ---------- pick the right cover when the automatic match is wrong ---------- */
async function coverOptions(a,t){
  const cleanT = t.replace(/\s*\([^)]*\)\s*/g," ").trim() || t, na = norm(a), out = [], seen = new Set();
  const push = (artist, album, thumb, big) => {
    const ra = norm(artist); if (!(ra===na || ra.includes(na) || na.includes(ra))) return;
    if (isBadTitle(artist+" "+album) || seen.has(big)) return; seen.add(big);
    const close = relaxT(album).includes(relaxT(cleanT)) || relaxT(cleanT).includes(relaxT(album));
    out.push({album, thumb, big, close});
  };
  const [it1, it2, dz] = await Promise.all([
    jsonp(cb=>`https://itunes.apple.com/search?term=${encodeURIComponent(a+" "+cleanT)}&entity=album&limit=25&callback=${cb}`),
    jsonp(cb=>`https://itunes.apple.com/search?term=${encodeURIComponent(a)}&entity=album&attribute=artistTerm&limit=60&callback=${cb}`),
    jsonp(cb=>`https://api.deezer.com/search/album?q=${encodeURIComponent(a+" "+cleanT)}&limit=25&output=jsonp&callback=${cb}`)
  ]);
  for (const res of [it1, it2]) if (res && res.results) for (const r of res.results)
    if (r.artworkUrl100) push(r.artistName||"", r.collectionName||"", r.artworkUrl100, r.artworkUrl100.replace("100x100bb","500x500bb"));
  if (dz && dz.data) for (const r of dz.data) if (r.cover_big) push(r.artist&&r.artist.name||"", r.title||"", r.cover_medium||r.cover_big, r.cover_big);
  out.sort((x,y)=> (y.close-x.close));
  return out.slice(0,18);
}
function setCover(key, url){
  COVER_CACHE[key] = url;
  try{ localStorage.setItem("vinylCoversV5", JSON.stringify(COVER_CACHE)); }catch(e){}
  document.querySelectorAll(".sl[data-cov]").forEach(box=>{ if (box.dataset.cov===key){ const im = box.querySelector("img"); if (im) im.src = url; } });
  applyCover(key, url);
}
async function showCoverPicker(a,t){
  const box = $("#covpick"); if (!box) return;
  box.innerHTML = `<div class="tlh"><span class="spin"></span>Looking for covers…</div>`;
  const opts = await coverOptions(a,t);
  if (!$("#covpick")) return;
  $("#covpick").innerHTML = opts.length
    ? `<div class="tlh">Tap the right one:</div><div class="cgrid">${opts.map(o=>`<button class="copt" data-big="${esc(o.big)}" data-key="${esc(coverKey(a,t))}" title="${esc(o.album)}"><img src="${esc(o.thumb)}" alt=""><span>${esc(o.album)}</span></button>`).join("")}</div>`
    : `<div class="tlh">Couldn't find other covers for this one.</div>`;
}


/* ---------- shared sync (you + dad), stored in a private ExtendsClass bin ---------- */
const SYNC_URL = "https://extendsclass.com/api/json-storage/bin/";
let SYNC = null, pushTimer = null, lastRemoteAt = 0, syncing = false;
function hashSync(){ const m = location.hash.match(/k=([A-Za-z0-9]+)\.([A-Za-z0-9]+)/); return m ? {id:m[1], key:m[2]} : null; }
SYNC = hashSync();
if (!SYNC){ try{ SYNC = JSON.parse(localStorage.getItem("vinylSync")||"null"); }catch(e){} }
if (SYNC){ try{ localStorage.setItem("vinylSync", JSON.stringify(SYNC)); }catch(e){}
  if (!hashSync()) try{ history.replaceState(null, "", "#k="+SYNC.id+"."+SYNC.key); }catch(e){} }
const setSync = t => { const el = $("#syncState"); if (el) el.textContent = t; };
const cleanJSON = t => JSON.parse(t.split(/<!doctype/i)[0].trim());
const ago = ts => { const s = Math.round((Date.now()-ts)/1000); return s<60 ? "just now" : s<3600 ? Math.round(s/60)+" min ago" : new Date(ts).toLocaleString(); };
function forCloud(st){ const c = JSON.parse(JSON.stringify(st)); for (const l of ["wish","have","picks"]) (c[l]||[]).forEach(x=>delete x.photo); return c; }
function merge(local, remote){
  const del = Object.assign({}, remote.deleted||{}, local.deleted||{});
  const ids = new Set(); ["wish","have","picks"].forEach(l=>(local[l]||[]).forEach(x=>ids.add(x.id)));
  ["wish","have","picks"].forEach(l=>{ local[l] = (local[l]||[]).filter(x=>!(remote.deleted||{})[x.id]);
    (remote[l]||[]).forEach(x=>{ if (!ids.has(x.id) && !del[x.id]) { local[l].push(x); ids.add(x.id); } }); });
  local.deleted = del; return local;
}
async function getRemote(){
  const r = await fetch(SYNC_URL+SYNC.id, {headers:{"Security-key":SYNC.key}, cache:"no-store"});
  if (!r.ok) throw new Error("get "+r.status);
  return cleanJSON(await r.text());
}
async function pull(){
  if (!SYNC || syncing) return; syncing = true;
  try{
    const remote = await getRemote();
    if (remote && remote.wish){
      const ra = remote.savedAt||0;
      if (ra > (S.savedAt||0)){ S = remote; S.picks = S.picks||[]; try{ localStorage.setItem("vinylRoomV3", JSON.stringify(S)); }catch(e){} closeModal(); render(); }
      else if ((S.savedAt||0) > ra) schedulePush(0);
      lastRemoteAt = ra;
    }
    setSync("🔄 Shared · synced " + ago(Date.now()));
  }catch(e){ setSync("⚠️ Offline, will sync later"); }
  syncing = false;
}
function schedulePush(delay){
  if (!SYNC) return; clearTimeout(pushTimer);
  setSync("🔄 Saving…");
  pushTimer = setTimeout(push, delay==null ? 1200 : delay);
}
async function push(){
  if (!SYNC) return;
  if (syncing){ schedulePush(800); return; } syncing = true;
  try{
    let remote = null; try{ remote = await getRemote(); }catch(e){}
    if (remote && remote.wish && (remote.savedAt||0) > lastRemoteAt){ S = merge(S, remote); S.savedAt = Date.now(); try{ localStorage.setItem("vinylRoomV3", JSON.stringify(S)); }catch(e){} render(); }
    const body = JSON.stringify(forCloud(S));
    const r = await fetch(SYNC_URL+SYNC.id, {method:"PUT", headers:{"Content-Type":"application/json","Security-key":SYNC.key}, body});
    if (!r.ok) throw new Error("put "+r.status);
    lastRemoteAt = S.savedAt||0;
    setSync("🔄 Shared · synced " + ago(Date.now()));
  }catch(e){ setSync("⚠️ Couldn't sync, will retry"); setTimeout(()=>schedulePush(0), 20000); }
  syncing = false;
}
async function createShared(){
  try{
    const key = Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b=>b.toString(36)).join("").slice(0,20);
    S.savedAt = S.savedAt || Date.now();
    const r = await fetch(SYNC_URL, {method:"POST", headers:{"Content-Type":"application/json","Security-key":key,"Private":"true"}, body:JSON.stringify(forCloud(S))});
    const j = cleanJSON(await r.text()); if (!j.id) throw 0;
    SYNC = {id:j.id, key}; try{ localStorage.setItem("vinylSync", JSON.stringify(SYNC)); }catch(e){}
    history.replaceState(null, "", "#k="+SYNC.id+"."+SYNC.key); lastRemoteAt = S.savedAt;
    syncUI(); setSync("🔄 Shared · synced just now"); toast("Shared list created. Copy the link and send it to Dad");
  }catch(e){ toast("Couldn't create the shared list"); }
}
function syncUI(){
  const box = $("#syncBox"); if (!box) return;
  box.innerHTML = SYNC
    ? `<span id="syncState" class="sst">🔄 Shared</span><button class="dl" id="shareBtn">🔗 Copy link for Dad</button>`
    : `<button class="dl" id="mkShare">🔗 Create shared list</button>`;
  const sb = $("#shareBtn"); if (sb) sb.onclick = async ()=>{ try{ await navigator.clipboard.writeText(location.href); toast("Link copied. Send it to Dad"); }catch(e){ prompt("Copy this link:", location.href); } };
  const mk = $("#mkShare"); if (mk) mk.onclick = createShared;
}

/* ---------- saving ---------- */
let NS = null, saveTimer = null, readOnly = false;
const setSave = t => $("#saveState").textContent = t;
function buildDoc(){
  const st = JSON.stringify(S).replace(/<\//g,"<\\/");
  const font = document.head.querySelector('link[href*="fonts.googleapis"]');
  return '<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'
    + "<title>Shahaf's Vinyl Shelf</title>" + (font?font.outerHTML:"")
    + '<style id="css">' + $("#css").textContent + '<\/style></head><body><div id="shell">' + SHELL + '</div>'
    + '<script id="state" type="application/json">' + st + '<\/script>'
    + '<script id="app">' + $("#app").textContent + '<\/script></body></html>';
}
function save(){
  S.savedAt = Date.now(); try{ localStorage.setItem("vinylRoomV3", JSON.stringify(S)); }catch(e){}
  schedulePush();
  if (readOnly) return;
  if (!NS){ setSave(LOCAL ? "Saved on this device" : ""); return; }
  setSave("Saving…"); clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await NS.publish(buildDoc()); setSave("Saved ✓"); }
    catch(e){
      if (e && (e.code==="not_granted"||e.code==="not_writer")){ readOnly=true; setSave("View-only"); }
      else if (e && e.code==="conflict") setSave("Updated elsewhere");
      else setSave("Saved on this device");
    }
  }, 1200);
}
(async ()=>{
  try{ const c = window.claude && await window.claude.use("artifact"); if (c) NS = c; else { LOCAL = true; loadLocal(); } }
  catch(e){ LOCAL = true; loadLocal(); }
})();
function loadLocal(){ try{ const l = JSON.parse(localStorage.getItem("vinylRoomV3")||"null"); if (l && l.wish && l.picks && (l.savedAt||0) > (S.savedAt||0)){ S = l; render(); } }catch(e){} }

/* ---------- toast ---------- */
let tt;
function toast(msg, undo){
  const t = $("#toast");
  t.innerHTML = esc(msg) + (undo ? ' <button id="undo">Undo</button>' : "");
  t.classList.add("show");
  if (undo) $("#undo").onclick = ()=>{ undo(); t.classList.remove("show"); };
  clearTimeout(tt); tt = setTimeout(()=>t.classList.remove("show"), 4500);
}

/* ---------- actions ---------- */
function addTo(list,a,t,y,tier){
  if (where(a,t)) { toast("Already on your shelf"); return false; }
  const o={id:uid(),a,t,y:y?(Number(y)||y):""}; if(TIERED(list)) o.tier=tier||addTier; S[list].unshift(o); save(); render();
  toast(TIERED(list) ? `“${t}” added to ${LISTNAME[list]} · ${TIERS.find(x=>x[0]===o.tier)[1]}` : `“${t}” added to your collection`);
  return true;
}
function find(id){ for (const l of ["wish","picks","have"]){ const i=S[l].findIndex(x=>x.id===id); if(i>=0) return {l,i,it:S[l][i]}; } return null; }
function remove(id){
  const f = find(id); if (!f) return;
  S[f.l].splice(f.i,1); S.deleted = S.deleted||{}; S.deleted[id] = Date.now(); save(); closeModal(); render();
  toast(`Removed “${f.it.t}”`, ()=>{ S[f.l].splice(f.i,0,f.it); delete S.deleted[id]; save(); render(); });
}
function move(id){
  const f = find(id); if (!f) return; const to = TIERED(f.l)?"have":"wish";
  S[f.l].splice(f.i,1); if (to==="have") delete f.it.tier; else f.it.tier = f.it.tier||"good"; S[to].unshift(f.it); save(); closeModal(); render();
  toast(to==="have" ? `“${f.it.t}” is on your shelf now 🎉` : `“${f.it.t}” back on the wishlist`, ()=>{
    const j=S[to].findIndex(x=>x.id===id); if(j>=0) S[to].splice(j,1); S[f.l].splice(f.i,0,f.it); save(); render(); });
}
let photoFor = null;
$("#photoInput").addEventListener("change", e=>{
  const file = e.target.files[0]; e.target.value=""; if (file&&photoFor) setPic(file, photoFor);
});
function setPic(file, forId){
  if (!file || !/^image\//.test(file.type)) { toast("That isn't a picture"); return; }
  photoFor = forId;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = ()=>{
    const side=400, c=document.createElement("canvas"); c.width=c.height=side;
    const s=Math.min(img.width,img.height); c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,side,side);
    URL.revokeObjectURL(url);
    const f = find(photoFor); if (f){ f.it.photo = c.toDataURL("image/jpeg",.8); save(); render(); openModal(photoFor); toast("Picture added"); }
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); toast("Couldn't read that picture"); };
  img.src = url;
}
let openId = null;
document.addEventListener("paste", e=>{
  if (!openId) return; const fl = [...(e.clipboardData&&e.clipboardData.files||[])].find(x=>/^image\//.test(x.type));
  if (fl){ e.preventDefault(); setPic(fl, openId); }
});

$("#modal").addEventListener("click", e=>{
  const pc = e.target.closest("[data-pickcov]"); if (pc && openId){ const f = find(openId); if (f) showCoverPicker(f.it.a, f.it.t); return; }
  const co = e.target.closest(".copt"); if (co){ setCover(co.dataset.key, co.dataset.big); $("#covpick").innerHTML = `<div class="tlh">Cover updated ✓</div>`; toast("Cover updated"); return; }
  const pt = e.target.closest("[data-ptier]"); if (pt && prev){ addTier = pt.dataset.ptier; document.querySelectorAll("[data-ptier]").forEach(x=>{ x.classList.toggle("on", x===pt); x.setAttribute("aria-checked", x===pt); }); return; }
  const pa = e.target.closest("[data-padd]"); if (pa && prev){ const {a,t,y} = prev; if (addTo(pa.dataset.padd,a,t,y,addTier)) closeModal(); return; }
  if (e.target.id==="modal" || e.target.closest("[data-close]")) return closeModal();
  const b = e.target.closest("button"); if (!b) return;

  else if (b.dataset.del) remove(b.dataset.del);
  else if (b.dataset.photo){ photoFor=b.dataset.photo; $("#photoInput").click(); }
  else if (b.dataset.unpic){ const f=find(b.dataset.unpic); if(f){ delete f.it.photo; save(); render(); openModal(f.it.id); } }
  else if (b.dataset.tier){ const f=find(b.dataset.id); if(f&&f.it.tier!==b.dataset.tier){ const old=f.it.tier; f.it.tier=b.dataset.tier; save(); render(); openModal(f.it.id);
      toast(`Moved to ${TIERS.find(x=>x[0]===b.dataset.tier)[1]}`, ()=>{ f.it.tier=old; save(); render(); if(openId===f.it.id) openModal(f.it.id); }); } }
});

/* ---------- views ---------- */
function slot(it, i){

    <div class="disc" style="--lab:${labelColor(it.a,it.t)}"></div>${sleeve(it,false)}<div class="cap"><b>${esc(it.t)}</b><span>${esc(it.a)}</span></div></div>`;
}
function shelfView(list){
  const items = S[list], f = norm(q);
  const shown = f ? items.filter(x=>norm(x.a+" "+x.t).includes(f)) : items;
  const label = list==="have" ? "My collection — tap to pull one out" : "Tap a record to pull it out";
  const dbx = f ? dbSuggest(f, list) : "";
  if (!items.length) return `<div class="unit"><div class="empty"><b>${list==="have"?"The shelf is empty":"Nothing here yet"}</b>
    Search above to add albums, or open Find records.
    <div style="margin-top:16px"><button class="btn gold" data-go="add">＋ Find records</button></div></div></div>` + dbx;
  if (TIERED(list)){
    if (f && !shown.length) return `<div class="unit"><div class="empty">Nothing on this shelf matches “${esc(q)}”.</div></div>` + dbx;
    return TIERS.map(([k,l,i])=>{ const its = shown.filter(x=>x.tier===k); if (f && !its.length) return "";
      return `<div class="unit"><div class="label"><span class="ti">${i}</span> ${l} <span class="lc">${its.length}</span></div>
        ${its.length?`<div class="shelf">${its.map(slot).join("")}</div>`:`<div class="mt">Nothing here yet. Open a record and tap “${l}” to move it here.</div>`}</div>`; }).join("") + dbx;
  }
  return `<div class="unit"><div class="label">${label}${f?` · ${shown.length} match`:""}</div>
    ${shown.length?`<div class="shelf">${shown.map(slot).join("")}</div>`:`<div class="empty">Nothing matches “${esc(q)}”.</div>`}</div>` + dbx;
}
function dbMatches(f){ const words=f.split(" ").filter(Boolean);
  return CAT.filter(([a,t])=>{ const s=norm(a+" "+t); return words.every(w=>s.includes(w)); })
    .sort((x,y)=> (norm(y[0]).startsWith(f)-norm(x[0]).startsWith(f)) || (x[2]-y[2])); }
function dbSuggest(f, list){
  const m = dbMatches(f).filter(([a,t])=>!where(a,t)).slice(0,8); if (!m.length) return "";
  return `<div class="ph" style="font-size:18px">Add from the database</div><div class="panel">${tierPick()}${m.map(([a,t,y])=>resRow(a,t,y)).join("")}</div>`;
}
let addTier = "good";
function tierPick(){ return `<div class="tp"><span>Add to:</span>${TIERS.map(([k,l,i])=>`<button class="chip ${addTier===k?"on":""}" data-tp="${k}">${i} ${l}</button>`).join("")}</div>`; }
function resRow(a,t,y,sub){
  return resRow0(a,t,y,sub).replace('<div class="res">', `<div class="res" data-prev="1" data-a="${esc(a)}" data-t="${esc(t)}" data-y="${esc(y)}" title="Tap to see the songs">`).replace('<div class="acts">','<div class="acts"><button class="btn" data-songs="1">🎵 Songs</button>');
}
function resRow0(a,t,y,sub){
  const w = where(a,t), d = `data-a="${esc(a)}" data-t="${esc(t)}" data-y="${esc(y)}"`;
  return `<div class="res">${sleeve({a,t},false)}<div class="meta"><b>${esc(t)}</b><span>${esc(a)}${y?" · "+esc(y):""}${sub?" · "+esc(sub):""}</span></div>
    <div class="acts">${w?`<button class="btn" disabled>${w==="have"?"◉ Owned":w==="picks"?"♥ In my picks":"♡ On wishlist"}</button>`:`<button class="btn gold" data-add="wish" ${d}>♡ Wishlist</button><button class="btn" data-add="have" ${d}>◉ Own it</button>`}</div></div>`;
}
let ai = null, aiQ = "", aiBusy = false, aiErr = "";
function findView(){
  const f = norm(q);
  const words = f.split(" ").filter(Boolean);
  let local = [];
  if (f){
    local = dbMatches(f);
  }
  const artists = ["Alice in Chains","Soundgarden","Pink Floyd","Radiohead","Metallica","Led Zeppelin","Pearl Jam","Rainbow","Deftones","Mashina"];
  let aiBlock = "";
  if (f){
    if (aiBusy) aiBlock = `<div class="hint"><span class="spin"></span>Looking through every album…</div>`;
    else if (aiErr) aiBlock = `<div class="hint">${esc(aiErr)}</div>`;
    else if (ai && aiQ===f) aiBlock = ai.length ? ai.map(x=>resRow(x.artist,x.title,x.year,x.type)).join("") : `<div class="hint">Nothing else found.</div>`;
    else aiBlock = `<div class="hint"><button class="btn gold" id="aiGo">🔎 Search beyond the database</button></div>`;
  }
  return `<div class="ph">Find records <small>${CAT.length} albums in the crate</small></div>
  <div class="panel">${tierPick()}${f ? (local.length ? local.slice(0,40).map(([a,t,y])=>resRow(a,t,y)).join("") + (local.length>40?`<div class="hint">+${local.length-40} more, so type more to narrow it down</div>`:"")
      : `<div class="hint">Not in the crate.</div>`)
    : `<div class="hint">Search an artist or album, like “in rainbows”, “sabbath” or “unplugged”. Or start with:</div><div class="chips">${artists.map(a=>`<button class="chip" data-q="${esc(a)}">${esc(a)}</button>`).join("")}</div>`}</div>
  ${f?`<div class="ph" style="font-size:18px">Can't find it?</div><div class="panel">${aiBlock}</div>`:""}
  <div class="ph" style="font-size:18px">Add one yourself</div>
  <div class="panel"><form id="manual"><div class="row"><input name="t" placeholder="Album title" required><input name="a" placeholder="Artist" required><input name="y" placeholder="Year" inputmode="numeric"></div>
  <div class="formacts"><button class="btn gold" type="submit" data-to="wish">♡ Add to wishlist</button><button class="btn" type="submit" data-to="have">◉ Add to my collection</button></div></form></div>`;
}
function render(){
  document.querySelectorAll(".plate").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  $("#filter").placeholder = tab==="add" ? "Search albums or artists…" : "Search this shelf or add new albums…";
  $("#sWish").textContent = S.wish.length; $("#sHave").textContent = S.have.length;
  $("#main").innerHTML = tab==="add" ? findView() : shelfView(tab);
  const go = $("#aiGo"); if (go) go.onclick = aiSearch;
  const m = $("#manual");
  if (m) m.onsubmit = e=>{ e.preventDefault();
    const to=(e.submitter&&e.submitter.dataset.to)||"wish", fd=new FormData(m), a=fd.get("a").trim(), t=fd.get("t").trim();
    if (a&&t&&addTo(to,a,t,fd.get("y").trim())) m.reset(); };
  loadCovers();
}
async function aiSearch(){
  const f = norm(q); if (!f) return;
  let sample = null; try{ sample = window.claude && await window.claude.use("sample"); }catch(e){}
  if (!sample){ aiErr = "Wider search isn't available here. Add it yourself below."; render(); return; }
  aiBusy = true; aiErr = ""; render();
  const prompt = `You are a music catalog. Search: "${q}".\nReturn ONLY a JSON array of up to 10 real, officially released albums (studio, live, EP or compilation) matching the search by artist or album title. Never invent albums.\nEach item: {"artist":string,"title":string,"year":number,"type":"Studio"|"Live"|"EP"|"Compilation"}`;
  try{
    let r = sample.json ? await sample.json(prompt,{modelTier:"quick"}) : JSON.parse((await sample(prompt,{modelTier:"quick"})).text.replace(/^[^\[]*/,"").replace(/[^\]]*$/,""));
    if (!Array.isArray(r)) r = (r&&(r.albums||r.results))||[];
    ai = r.filter(x=>x&&x.artist&&x.title).slice(0,10); aiQ = f;
  }catch(e){ aiErr = e&&e.code==="rate_limited" ? "Too many searches. Try again in a minute." : "That search didn't work. Add it yourself below."; }
  aiBusy = false; render();
}

/* ---------- events ---------- */
$("#tabs").addEventListener("click", e=>{ const b=e.target.closest(".plate"); if(!b) return; tab=b.dataset.tab; q=""; $("#filter").value=""; ai=null; aiErr=""; render(); });
let ft; $("#filter").addEventListener("input", e=>{ q=e.target.value; aiErr=""; clearTimeout(ft); ft=setTimeout(render,140); });
$("#filter").addEventListener("keydown", e=>{ if (e.key==="Enter"&&tab==="add"){ e.preventDefault(); e.target.blur(); } });
$("#main").addEventListener("click", e=>{
  const s = e.target.closest("[data-open]"); if (s) return openModal(s.dataset.open);
  const b = e.target.closest("button");
  const pr = e.target.closest(".res[data-prev]");
  if (pr && (!b || b.dataset.songs)) return openPreview(pr.dataset.a, pr.dataset.t, pr.dataset.y);
  if (!b) return;
  if (b.dataset.go){ tab=b.dataset.go; render(); }
  else if (b.dataset.q){ q=b.dataset.q; $("#filter").value=q; render(); }
  else if (b.dataset.tp){ addTier=b.dataset.tp; render(); }
  else if (b.dataset.add) addTo(b.dataset.add,b.dataset.a,b.dataset.t,b.dataset.y,addTier);
});
$("#main").addEventListener("keydown", e=>{ const s=e.target.closest("[data-open]"); if (s&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); openModal(s.dataset.open); } });
/* ---------- save a copy (to move changes to another device) ---------- */
$("#dlBtn") && $("#dlBtn").addEventListener("click", ()=>{
  try{
    S.savedAt = Date.now();
    const blob = new Blob([buildDoc()], {type:"text/html"});
    const url = URL.createObjectURL(blob), link = document.createElement("a");
    link.href = url; link.download = "Shahaf_Record_Room.html"; document.body.appendChild(link); link.click(); link.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast("Saved. Send this new file to your phone");
  }catch(e){ toast("Couldn't save a copy here"); }
});
render();
syncUI(); pull();
})();
</script></body></html>
